# Cấu hình mặc định khi phát triển. Khi chạy dịch vụ, bộ cài ghi đè bằng
# C:\ProgramData\TrainingStats\config\application.properties (cổng, thư mục dữ liệu, file log).
server:
  port: ${APP_PORT:8080}
  error:
    whitelabel:
      enabled: false
  servlet:
    # Thêm charset=UTF-8 vào mọi response (JSON, JS, CSS), để mọi trình khách đọc đúng tiếng Việt.
    encoding:
      charset: UTF-8
      force-response: true
    session:
      # Mặc định cho phiên chưa đăng nhập. Thời gian thật của phiên đăng nhập lấy từ app_setting
      # (session.timeout-minutes) lúc đăng nhập.
      timeout: 30m
      cookie:
        name: TSSESSION
        http-only: true
        same-site: lax
        # Hệ thống chạy HTTP trong LAN (đã chốt không làm HTTPS). Bật Secure thì trình duyệt không gửi cookie.
        secure: false

app:
  data-dir: ${APP_DATA_DIR:./data}
  db-file: trainingstats.db
  # Thư mục cấu hình, nơi bộ cài đặt first-run.properties. Mặc định nằm cạnh thư mục dữ liệu.
  config-dir: ${APP_CONFIG_DIR:${app.data-dir}/../config}
  read-pool-size: 4

spring:
  application:
    name: trainingstats
  servlet:
    # Nhập Excel (R7): file tối đa 5 MB. Máy chủ còn kiểm lại kích thước và số dòng khi đọc.
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    time-zone: UTC
  flyway:
    locations: classpath:db/migration

# File log: bộ cài đặt logging.file.name trong file cấu hình của dịch vụ. Khi phát triển chỉ in ra console.
logging:
  level:
    com.zaxxer.hikari: WARN
  # Xoay vòng file log (M7.3): mỗi file tối đa 10 MB, giữ 30 ngày, tổng tối đa 300 MB; file cũ nén .gz.
  # Chỉ có tác dụng khi có logging.file.name (dịch vụ Windows, bộ cài đặt ghi trong application.properties).
  logback:
    rollingpolicy:
      file-name-pattern: "${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz"
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 300MB
